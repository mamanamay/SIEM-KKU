/var/log/firewall/*.log
/var/log/revproxy/*.log {
    hourly
    rotate 24
    missingok
    notifempty
    compress
    delaycompress
    # Fix: removed 'copytruncate' -- startFileTail uses watchFile+createReadStream
    # and does NOT hold a persistent file descriptor, so copytruncate is unnecessary
    # and can cause log lines to be ingested twice during the copy window.
    create 0644 root root
    postrotate
        pkill -HUP rsyslog 2>/dev/null || true
    endscript
}
