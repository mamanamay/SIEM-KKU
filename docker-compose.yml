# ============================================================
# KKUSIEM Honeypot Dashboard — Production Docker Compose
# ============================================================
# All ports are configured via .env file.
# Deploy: docker compose config --quiet && docker compose up -d --build (see DEPLOY.md).
#
# ─── Log Ingestion Architecture ─────────────────────────────
#  Firewall / NGINX APIs ◀──GET── backend (Settings > Log API)
#  Other sources ──POST──▶ /api/ingest (X-Ingest-Key)
#  Durable receipts / processing queue / alert evidence live in PostgreSQL.
# ============================================================

services:

  # ── 1. Reverse Proxy & SSL ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: siem_nginx
    restart: unless-stopped
    mem_limit: ${NGINX_MEMORY_LIMIT:-128m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?required}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_ENVSUBST_FILTER=PUBLIC_ORIGIN
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }

  # ── 2. Frontend (SvelteKit) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siem_frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-384m}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=256
      - ORIGIN=${PUBLIC_ORIGIN:?required}
    expose:
      - "3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      backend: { condition: service_healthy }

  # ── 3. Backend (NestJS API & WebSockets) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siemt_backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}
      - JWT_SECRET=${JWT_SECRET:?required}
      - NODE_ENV=production
      # Optional additional CA bundle; path is inside the backend container.
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      - NODE_OPTIONS=--max-old-space-size=512
      - MEMORY_DIAGNOSTICS_LOG=${MEMORY_DIAGNOSTICS_LOG:-false}
      - MAX_API_LOG_WRITES=${MAX_API_LOG_WRITES:-16}
      - MAX_HTTP_BODY_REQUESTS=${MAX_HTTP_BODY_REQUESTS:-8}
      - MAX_RECEIPT_WRITES=${MAX_RECEIPT_WRITES:-4}
      - MAX_LOG_BYTES=${MAX_LOG_BYTES:-65536}
      - DETECTION_MAX_BATCH_SIZE=${DETECTION_MAX_BATCH_SIZE:-250}
      - DETECTION_MAX_BATCH_BYTES=${DETECTION_MAX_BATCH_BYTES:-2097152}
      - DETECTION_MAX_INFLIGHT_BYTES=${DETECTION_MAX_INFLIGHT_BYTES:-2097152}
      - DETECTION_IDLE_MS=${DETECTION_IDLE_MS:-100}
      - RECEIPT_LEASE_MS=${RECEIPT_LEASE_MS:-120000}
      - MAX_PENDING_EVENTS=${MAX_PENDING_EVENTS:-100000}
      - MAX_DETECTION_ATTEMPTS=${MAX_DETECTION_ATTEMPTS:-5}
      - LOG_API_MAX_RECORDS=${LOG_API_MAX_RECORDS:-1000}
      - LOG_API_MAX_RESPONSE_BYTES=${LOG_API_MAX_RESPONSE_BYTES:-2097152}
      - LOG_API_TIMEOUT_MS=${LOG_API_TIMEOUT_MS:-15000}
      - LOG_API_SSE_IDLE_TIMEOUT_MS=${LOG_API_SSE_IDLE_TIMEOUT_MS:-120000}
      - STATIC_ANALYSIS_MODE=${STATIC_ANALYSIS_MODE:-false}
      - TOTP_ISSUER=${TOTP_ISSUER:-KKUSIEM}
      - MAX_WS_CLIENTS=${MAX_WS_CLIENTS:-32}
      - MAX_WS_PENDING_PACKETS=${MAX_WS_PENDING_PACKETS:-128}
      - MAX_WS_PENDING_BYTES=${MAX_WS_PENDING_BYTES:-8388608}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL:-${PUBLIC_ORIGIN}/callback}
      - SSO_WEB_URL=${SSO_WEB_URL:-https://ssonext.kku.ac.th}
      - SSO_API_URL=${SSO_API_URL:-https://ssonext-api.kku.ac.th}
      - INGEST_API_KEY=${INGEST_API_KEY:?required}
      - DETECTION_API_KEY=${DETECTION_API_KEY:?required}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:?required}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - OUTBOUND_ALLOWED_HOSTS=${OUTBOUND_ALLOWED_HOSTS:-gen.ai.kku.ac.th,hooks.slack.com,.webhook.office.com,ssonext-api.kku.ac.th}
      - LOG_SCOPE=${LOG_SCOPE:-related}
      - LOG_COLLECTION_MODE=${LOG_COLLECTION_MODE:-api}
      - FIREWALL_SENSOR_IP=${FIREWALL_SENSOR_IP:-}
      - NGINX_SENSOR_IP=${NGINX_SENSOR_IP:-}
      - OUTBOUND_PRIVATE_HOSTS=${OUTBOUND_PRIVATE_HOSTS:-}
      - SIEM_RESPONSE_MODE=${SIEM_RESPONSE_MODE:-disabled}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:?required}
      - PDF_RENDER_URL=http://pdf-renderer:8200/render
      - SIEM_PUBLIC_BASE_URL=${SIEM_PUBLIC_BASE_URL:-${PUBLIC_ORIGIN}}
      - SIEM_MCP_ALLOWED_ORIGINS=${SIEM_MCP_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN}}
      - SIEM_TRUSTED_PROXY_CIDRS=${SIEM_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      - PDF_RENDER_KEY=${PDF_RENDER_KEY:?required}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    networks: [default, pdf]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ingest/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    expose:
      - "5000"
    volumes:
      - siem_logs:/app/siem-logs
      - siem_reports:/app/uploads
      # Public CA certificates only. No private keys. An absolute custom directory
      # keeps operator certificates outside the source replaced during deployment.
      - type: bind
        source: ${SIEM_CA_DIR:-/etc/ssl/certs}
        target: /app/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres: { condition: service_healthy }
      detection-engine: { condition: service_healthy }
      pdf-renderer: { condition: service_healthy }

  # Chromium alone receives the namespace capability required for its sandbox.
  # No host ports, DATABASE_URL, ingestion secrets, live logs or persistent data.
  pdf-renderer:
    build: { context: ./backend, dockerfile: Dockerfile }
    container_name: siem_pdf_renderer
    command: ["node", "config/pdf-worker.cjs"]
    restart: unless-stopped
    init: true
    cap_add: [SYS_ADMIN]
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/node:uid=1000,gid=1000,mode=0700,size=64m
    mem_limit: ${PDF_MEMORY_LIMIT:-512m}
    pids_limit: 256
    networks: [pdf]
    environment:
      - PDF_RENDER_KEY=${PDF_RENDER_KEY:?required}
    logging:
      driver: json-file
      options: { max-size: 50m, max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── 4. Database (PostgreSQL 16) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: siem_postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?required}
      - POSTGRES_DB=${POSTGRES_DB:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  # ── 6. Detection Engine (AI/ML) ──────────────────────────────
  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: siem_detection_engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "8100"
    mem_limit: ${DETECTION_MEMORY_LIMIT:-512m}
    init: true
    volumes:
      - ./detection-engine/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    environment:
      - NODE_ENV=production
      - DETECTION_API_KEY=${DETECTION_API_KEY:?required}
      - MAX_LOG_BYTES=${MAX_LOG_BYTES:-65536}
      - DETECTION_MAX_BATCH_SIZE=${DETECTION_MAX_BATCH_SIZE:-250}
      - MAX_ACTIVE_IPS=${MAX_ACTIVE_IPS:-1024}
      - MAX_ACTIVE_SESSIONS=${MAX_ACTIVE_SESSIONS:-2048}
      - INCIDENT_CACHE_SIZE=${INCIDENT_CACHE_SIZE:-200}
      - DETECTION_MAX_INFLIGHT_REQUESTS=${DETECTION_MAX_INFLIGHT_REQUESTS:-4}
      - FW_SCAN_PORTS=${FW_SCAN_PORTS:-20}
      - FW_SCAN_HOSTS=${FW_SCAN_HOSTS:-20}
      - FW_DENY_BURST=${FW_DENY_BURST:-100}
      - SHADOW_MODEL_PATH=${SHADOW_MODEL_PATH:-}
      - SHADOW_INFERENCE_INTERVAL_SECONDS=${SHADOW_INFERENCE_INTERVAL_SECONDS:-2}

volumes:
  pgdata:
  siem_logs:
  siem_reports:

networks:
  pdf:
    internal: true
