# ============================================================
# KKUSIEM Honeypot Dashboard â€” Production Docker Compose
# ============================================================
# All ports are configured via .env file.
# Run: cp .env.example .env â†’ edit .env â†’ docker compose up -d --build
#
# â”€â”€â”€ Log Ingestion Architecture â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
#  [à¸­à¸·à¹ˆà¸™à¹†]   â”€â”€HTTP POSTâ”€â”€â–¶ backend:5000/api/ingest/<source>
# ============================================================

services:

  # â”€â”€ 1. Reverse Proxy & SSL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  nginx:
    image: nginx:1.25-alpine
    container_name: siem_nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # â”€â”€ 2. Frontend (SvelteKit) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siem_frontend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=256
    expose:
      - "3000"
    depends_on:
      - backend

  # â”€â”€ 3. Backend (NestJS API & WebSockets) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siemt_backend
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
      - SIEM_REPLAY_EXISTING_LOGS=${SIEM_REPLAY_EXISTING_LOGS:-false}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL}
      - SSO_WEB_URL=${SSO_WEB_URL}
      - SSO_API_URL=${SSO_API_URL}
      - INGEST_API_KEY=${INGEST_API_KEY:-}
      - SIEM_PUBLIC_BASE_URL=${SIEM_PUBLIC_BASE_URL:-https://odt-siem-uat.kku.ac.th}
      - SIEM_TRUSTED_PROXY_CIDRS=${SIEM_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      - SIEM_MCP_ALLOWED_ORIGINS=${SIEM_MCP_ALLOWED_ORIGINS:-https://odt-siem-uat.kku.ac.th}
    ports:
      - "5000:5000"
    expose:
      - "5000"
    volumes:
      - siem_logs:/app/siem-logs
      - ${FIREWALL_LOG_DIR:-/var/log/firewall}:/var/log/firewall:ro
      - ${REVPROXY_LOG_DIR:-/var/log/revproxy}:/var/log/revproxy:ro
      - /:/hostfs:ro
    depends_on:
      - postgres
      - redis

  # â”€â”€ 4. Database (PostgreSQL 16) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  postgres:
    image: postgres:16-alpine
    container_name: siem_postgres
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  # â”€â”€ 5. Cache / Message Broker (Redis 7) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    container_name: siem_redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    expose:
      - "6379"

  # â”€â”€ 6. Detection Engine (AI/ML) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: siem_detection_engine
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "8100:8100"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  siem_logs:

