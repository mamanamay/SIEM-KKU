version: '3.8'

services:
  # 1. Reverse Proxy & SSL Termination
  nginx:
    image: nginx:1.25-alpine
    container_name: honeypot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # 2. Frontend (SvelteKit)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeypot_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  # 3. Backend (NestJS API & WebSockets)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeypot_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    expose:
      - "5000"
    volumes:
      # Share logs with backend
      - ./cowrie-config/var/log/cowrie:/app/logs:ro
    depends_on:
      - postgres
      - redis

  # 4. Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: honeypot_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  # 5. Message Broker / Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: honeypot_redis
    restart: unless-stopped
    expose:
      - "6379"

  # 6. Honeypot (Cowrie)
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie-honeypot
    restart: always
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - ./cowrie-config/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./cowrie-config/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./cowrie-config/var/log/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./cowrie-config/var/lib/cowrie:/cowrie/cowrie-git/var/lib/cowrie
    environment:
      - COWRIE_TELNET_ENABLED=yes

volumes:
  pgdata:
