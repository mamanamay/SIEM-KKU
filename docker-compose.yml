version: '3.8'

# ============================================================
# KKUSIEM Honeypot Dashboard — Production Docker Compose
# ============================================================
# All ports are configured via .env file.
# Run: cp .env.example .env → edit .env → docker compose up -d --build
#
# ─── Log Ingestion Architecture ─────────────────────────────
#  [อื่นๆ]   ──HTTP POST──▶ backend:5000/api/ingest/<source>
# ============================================================

services:

  # ── 1. Reverse Proxy & SSL ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: siem_nginx
    restart: unless-stopped
    ports:
      - "18080:80"
      - "18443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # ── 2. Frontend (SvelteKit) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siem_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    expose:
      - "3000"
    depends_on:
      - backend

  # ── 3. Backend (NestJS API & WebSockets) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siemt_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL}
      - SSO_WEB_URL=${SSO_WEB_URL}
      - SSO_API_URL=${SSO_API_URL}
      - INGEST_API_KEY=${INGEST_API_KEY:-}
    expose:
      - "5000"
    volumes:
      - siem_logs:/app/siem-logs
      - /var/log/firewall:/var/log/firewall:ro
      - /var/log/revproxy:/var/log/revproxy:ro
    depends_on:
      - postgres
      - redis

  # ── 4. Database (PostgreSQL 16) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: siem_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  # ── 5. Cache / Message Broker (Redis 7) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: siem_redis
    restart: unless-stopped
    expose:
      - "6379"

  # ── 6. Detection Engine (AI/ML) ──────────────────────────────
  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: siem_detection_engine
    restart: unless-stopped
    expose:
      - "8100"
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  siem_logs:
