version: '3.8'

# ============================================================
# KKUSIEM Honeypot Dashboard — Production Docker Compose
# ============================================================
# All ports are configured via .env file.
# Run: cp .env.example .env → edit .env → docker compose up -d --build
# ============================================================

services:

  # ── 1. Reverse Proxy & SSL ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: honeypot_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

  # ── 2. Frontend (SvelteKit) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: honeypot_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend

  # ── 3. Backend (NestJS API & WebSockets) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: honeypot_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL}
    expose:
      - "5000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis

  # ── 4. Database (PostgreSQL 16) ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: honeypot_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  # ── 5. Cache / Message Broker (Redis 7) ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: honeypot_redis
    restart: unless-stopped
    expose:
      - "6379"

  # ── 6. SSH/Telnet Honeypot (Cowrie) ─────────────────────────
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie-honeypot
    restart: always
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222"
      - "${COWRIE_TELNET_PORT:-2223}:2223"
    volumes:
      - ./honeypots/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypots/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ./honeypots/cowrie/var/lib/cowrie:/cowrie/cowrie-git/var/lib/cowrie
    environment:
      - COWRIE_TELNET_ENABLED=yes

  # ── 7. Web Vulnerability Honeypot (WebTrap) ──────────────────
  webtrap:
    build:
      context: ./honeypots/webtrap
      dockerfile: Dockerfile
    container_name: webtrap_honeypot
    restart: always
    ports:
      - "${WEBTRAP_HTTP_PORT:-8081}:8080"
      - "${WEBTRAP_HTTPS_PORT:-8444}:8443"
    volumes:
      - ./logs/webtrap:/logs
      - ./nginx/certs:/certs:ro

volumes:
  pgdata:
