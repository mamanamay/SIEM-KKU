[honeypot]
hostname = production-server
filesystem_file = var/lib/cowrie/fs.pickle

[shell]
kernel_version = 5.4.0-72-generic
kernel_build_string = #81-Ubuntu SMP Tue Nov 26 12:20:02 UTC 2019
hardware_platform = x86_64
operating_system = GNU/Linux

# ─── Output: JSON File (สำรอง ไว้ debug) ───────────────────────────────────
[output_json]
enabled = true
logfile = var/log/cowrie/cowrie.json

# ─── Output: HTTP POST ไปยัง Backend Ingest API ─────────────────────────────
# เปิดใช้งาน plugin นี้เพื่อให้ Cowrie ยิง Log ตรงไปที่ Backend ทันที
# url     = http://<hostname_ของ_backend_container>:<port>/api/ingest/cowrie
# แก้ url ให้ตรงกับ Environment ของคุณ:
#   - Docker Compose:  http://backend:5000/api/ingest/cowrie
#   - Server แยก:      http://192.168.x.x:5000/api/ingest/cowrie
[output_http]
enabled = true
url = http://backend:5000/api/ingest
# (Optional) เพิ่ม API Key สำหรับความปลอดภัย — ต้องตรงกับ INGEST_API_KEY ใน .env
# Authorization = Bearer <your-key-here>

[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0
